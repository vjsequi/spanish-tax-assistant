name: Repository and tax pack integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install hash-locked development tools
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify repository and imported sources
        run: python scripts/check_repository.py
      - name: Verify tax references, field map and synthetic inputs
        run: python -m scripts.check_tax_pack
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Strict types
        run: mypy
      - name: Repository and tax pack control tests
        run: python -m unittest discover -s tests -v
