[project]
name = "spanish-tax-assistant"
version = "0.1.0"
description = "Evidence-backed Spanish personal-tax review workbench: discovery foundation"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = ["ruff==0.16.10", "mypy==1.20.2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["scripts", "src", "tests"]
